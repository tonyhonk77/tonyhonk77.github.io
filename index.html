<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>~/project.status</title>
    <style>
        body {
            background: #0a0a0a;
            color: #00ff41;
            font-family: 'Courier New', monospace;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0;
        }
        .terminal {
            background: #0c0c0c;
            border: 1px solid #1f1f1f;
            border-radius: 8px;
            padding: 2rem;
            min-width: 400px;
            max-width: 90%;
        }
        .prompt { color: #00ff41; }
        .host { color: #ff5e5e; }
        .path { color: #5ea3ff; }
        .cursor::after {
            content: '_';
            animation: blink 1s step-end infinite;
        }
        @keyframes blink { 50% { opacity: 0; } }
        a { color: #ffd700; text-decoration: none; }
        a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="terminal">
        <p><span class="host">honk@server</span>:<span class="path">~/project</span>$ cat status.txt</p>
        <p style="margin-top: 1rem;">BUILD STATUS: <span style="color: #ffd700;">IN PROGRESS...</span></p>
        <p>ESTIMATED LAUNCH: <span style="color: #00ff41;">SOON™</span></p>
        <p>DEPLOY TARGET: <span style="color: #5ea3ff;">server/main</span></p>
        <br>
        <p><span class="host">honk@server</span>:<span class="path">~/project</span>$ <span class="cursor"></span></p>
        <p style="margin-top: 0.5rem; font-size: 0.8rem; color: #666;">
            * <a href="https://anykey.cc/hls-tester/">ffplay https://tony.honk/main.m3u8</a>
        </p>
    </div>
</body>
</html>
